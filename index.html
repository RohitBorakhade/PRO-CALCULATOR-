<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UltraPro — Advanced Scientific</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- local screenshot/logo (use exact path below) -->
      <img src="/mnt/data/39B22312-D775-4591-B015-4E03CFA53554.jpeg" alt="UltraPro" class="logo" />
      <div class="titles">
        <div class="app-name">UltraPro</div>
        <div class="app-mode">Advanced • Scientific</div>
      </div>
    </div>
    <div class="mode-pill">Calculator</div>
  </header>

  <main class="container">
    <section class="display-area">
      <div class="memory-rail">
        <button class="mem-btn" data-action="MC">MC</button>
        <button class="mem-btn" data-action="MR">MR</button>
        <button class="mem-btn" data-action="M+">M+</button>
        <button class="mem-btn" data-action="M-">M-</button>
        <button class="mem-btn" id="radDeg">RAD</button>
      </div>

      <div class="screen" id="screen">0</div>
    </section>

    <section class="pad">
      <div class="grid">
        <!-- Row 1 -->
        <button class="btn func" data-fn="sin">sin</button>
        <button class="btn func" data-fn="cos">cos</button>
        <button class="btn func" data-fn="tan">tan</button>
        <button class="btn func" data-fn="ln">ln</button>
        <button class="btn func" data-fn="log">log</button>
        <button class="btn op" data-op="pow">xʸ</button>

        <!-- Row 2 -->
        <button class="btn func" data-fn="sqrt">√</button>
        <button class="btn func" data-fn="x2">x²</button>
        <button class="btn func" data-fn="x3">x³</button>
        <button class="btn func" data-fn="recip">1/x</button>
        <button class="btn func" data-fn="exp">EXP</button>
        <button class="btn func" id="rand">RAND</button>

        <!-- Row 3 -->
        <button class="btn const" data-val="PI">π</button>
        <button class="btn const" data-val="E">e</button>
        <button class="btn const" data-val="PHI">φ</button>
        <button class="btn op" data-op="%">%</button>
        <button class="btn paren" data-val="(">(</button>
        <button class="btn paren" data-val=")">)</button>

        <!-- Row 4 -->
        <button class="btn num" data-num="7">7</button>
        <button class="btn num" data-num="8">8</button>
        <button class="btn num" data-num="9">9</button>
        <button class="btn op" data-op="÷">÷</button>
        <button class="btn action" id="DEL">DEL</button>
        <button class="btn action" id="AC">AC</button>

        <!-- Row 5 -->
        <button class="btn num" data-num="4">4</button>
        <button class="btn num" data-num="5">5</button>
        <button class="btn num" data-num="6">6</button>
        <button class="btn op" data-op="×">×</button>
        <button class="btn mem-small" id="mplus">M+</button>
        <button class="btn mem-small" id="mminus">M-</button>

        <!-- Row 6 -->
        <button class="btn num" data-num="1">1</button>
        <button class="btn num" data-num="2">2</button>
        <button class="btn num" data-num="3">3</button>
        <button class="btn op" data-op="−">−</button>
        <button class="btn empty"></button>
        <button class="btn empty"></button>

        <!-- Row 7 -->
        <button class="btn wide num" data-num="0">0</button>
        <button class="btn num" data-num=".">.</button>
        <button class="btn op" data-op="+">+</button>
        <button class="btn eq" id="equals">=</button>
        <button class="btn empty"></button>
        <button class="btn empty"></button>
      </div>
    </section>
  </main>

  <footer class="footer-note">
    UltraPro • Advanced Scientific — Mobile responsive
  </footer>

  <script src="script.js"></script>
</body>
</html>
