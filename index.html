<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Scientific Calculator</h2>

    <input id="display" class="display" type="text" readonly>

    <div id="buttons" class="buttons">

        <button id="degRadBtn">DEG</button>
        <button>MC</button>
        <button>MR</button>
        <button>M+</button>
        <button>M-</button>

        <button>sin</button>
        <button>cos</button>
        <button>tan</button>
        <button>log</button>
        <button>ln</button>

        <button>√</button>
        <button>x²</button>
        <button>x³</button>
        <button>xʸ</button>
        <button>EXP</button>

        <button>π</button>
        <button>e</button>
        <button>Ans</button>
        <button>AC</button>
        <button>DEL</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>/</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>*</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>-</button>

        <button>0</button>
        <button>.</button>
        <button>=</button>
        <button>+</button>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
